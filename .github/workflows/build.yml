                  android:layout_weight="1"
                  android:gravity="center_horizontal"
                  android:orientation="vertical">

                  <!-- 20:07（白）＋ :31（黃色秒數） -->
                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal">

                      <TextClock
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:format12Hour="HH:mm"
                          android:format24Hour="HH:mm"
                          android:includeFontPadding="false"
                      android:maxLines="1"
                      android:shadowColor="#2F6F3A"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="#FFFFFF"
                          android:textSize="32sp"
                          android:textStyle="bold" />

                      <TextClock
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:format12Hour=":ss"
                          android:format24Hour=":ss"
                          android:includeFontPadding="false"
                          android:maxLines="1"
                          android:shadowColor="#A8820A"
                          android:shadowDx="2"
                          android:shadowDy="2"
                          android:shadowRadius="1"
                          android:textColor="#FFD21F"
                          android:textSize="22sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <TextClock
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:format12Hour="yyyy/MM/dd EEEE"
                      android:format24Hour="yyyy/MM/dd EEEE"
                      android:includeFontPadding="false"
                      android:maxLines="1"
                      android:shadowColor="#2F6F3A"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="#FFFFFF"
                      android:textSize="12sp" />

                  <!-- 農曆（十齋日每 0.5 秒閃爍） -->
                  <FrameLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="1dp">

                      <TextView
                          android:id="@+id/lunar_text"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:includeFontPadding="false"
                      android:maxLines="1"
                      android:shadowColor="#2F6F3A"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="#FFFFFF"
                          android:text="丙午年 十月初八"
                          android:textSize="12sp" />

                      <ViewFlipper
                          android:id="@+id/fast_flipper"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:autoStart="true"
                          android:flipInterval="500"
                          android:visibility="gone">

                          <TextView
                              android:id="@+id/lunar_blink_on"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:includeFontPadding="false"
                      android:maxLines="1"
                      android:shadowColor="#2F6F3A"
                      android:shadowDx="0"
                      android:shadowDy="1"
                      android:shadowRadius="4"
                      android:textColor="#FFFFFF"
                              android:text="丙午年 十月初八"
                              android:textSize="12sp" />

                          <TextView
                              android:id="@+id/lunar_blink_off"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:includeFontPadding="false"
                              android:maxLines="1"
                              android:text="丙午年 十月初八"
                              android:textColor="#00FFFFFF"
                              android:textSize="12sp" />
                      </ViewFlipper>
                  </FrameLayout>

              </LinearLayout>
          </LinearLayout>
          LUNAR_EOF
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'LUNAR_EOF'
          <resources>
              <string name="app_name">農曆時鐘</string>
              <string name="widget_description">顯示時間（含秒）、西曆日期與農曆</string>
              <string name="widget_simple_name">農曆時鐘（簡易版）</string>
              <string name="widget_simple_description">顯示時間（不含秒）、日期、星期與農曆</string>
              <string name="widget_puppy_2x2_name">小狗跳跳時鐘 2×2</string>
              <string name="widget_puppy_2x2_description">小狗跳躍的迷你時鐘：時間、日期、星期、農曆</string>
              <string name="widget_puppy_4x1_name">小狗跳跳時鐘 4×1</string>
              <string name="widget_puppy_4x1_description">小狗跳躍的橫條時鐘：時間、日期、星期、農曆</string>
          </resources>
          LUNAR_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/widget_lunar_clock_info.xml <<'LUNAR_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/widget_description"
              android:initialLayout="@layout/widget_lunar_clock"
              android:minWidth="250dp"
              android:minHeight="40dp"
              android:minResizeWidth="180dp"
              android:minResizeHeight="40dp"
              android:resizeMode="horizontal|vertical"
              android:targetCellWidth="4"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          LUNAR_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/widget_lunar_clock_simple_info.xml <<'LUNAR_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/widget_simple_description"
              android:initialLayout="@layout/widget_lunar_clock_simple"
              android:minWidth="250dp"
              android:minHeight="40dp"
              android:minResizeWidth="180dp"
              android:minResizeHeight="40dp"
              android:resizeMode="horizontal|vertical"
              android:targetCellWidth="4"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          LUNAR_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/widget_puppy_2x2_info.xml <<'LUNAR_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/widget_puppy_2x2_description"
              android:initialLayout="@layout/widget_puppy_2x2"
              android:minWidth="110dp"
              android:minHeight="110dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="110dp"
              android:resizeMode="horizontal|vertical"
              android:targetCellWidth="2"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          LUNAR_EOF
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/widget_puppy_4x1_info.xml <<'LUNAR_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/widget_puppy_4x1_description"
              android:initialLayout="@layout/widget_puppy_4x1"
              android:minWidth="250dp"
              android:minHeight="70dp"
              android:minResizeWidth="250dp"
              android:minResizeHeight="70dp"
              android:resizeMode="horizontal|vertical"
              android:targetCellWidth="4"
              android:targetCellHeight="1"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          LUNAR_EOF
          cat > build.gradle.kts <<'LUNAR_EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          LUNAR_EOF
          cat > gradle.properties <<'LUNAR_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          LUNAR_EOF
          cat > settings.gradle.kts <<'LUNAR_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LunarClock"
          include(":app")
