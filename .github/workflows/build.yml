          LUNAR_EOF
          mkdir -p app/src/main/java/com/example/lunarclock
          cat > app/src/main/java/com/example/lunarclock/GreetingReceiver.kt <<'LUNAR_EOF'
          package com.example.lunarclock

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class GreetingReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  when (intent.action) {
                      Reminders.ACTION -> {
                          val id = intent.getIntExtra("id", -1)
                          val at = intent.getLongExtra("at", 0L)
                          val list = Reminders.load(context)
                          val r = list.firstOrNull { it.id == id } ?: return
                          if (!r.enabled) return
                          Reminders.show(context, r)
                          if (r.repeat) {
                              // 每年（重複）：排下一次
                              Reminders.schedule(context, r, maxOf(at, System.currentTimeMillis()))
                          } else {
                              // 只提醒一次：發完就停用
                              r.enabled = false
                              Reminders.save(context, list)
                          }
                      }
                      // 重開機或 App 更新後，鬧鐘會消失，要全部重新設定
                      Intent.ACTION_BOOT_COMPLETED,
                      Intent.ACTION_MY_PACKAGE_REPLACED -> Reminders.scheduleAll(context)
                  }
              }
          }
          LUNAR_EOF
          mkdir -p app/src/main/java/com/example/lunarclock
          cat > app/src/main/java/com/example/lunarclock/LunarClockSimpleWidget.kt <<'LUNAR_EOF'
          package com.example.lunarclock

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.provider.AlarmClock
          import android.widget.RemoteViews

          /**
           * 簡易版 Widget：20:07（不含秒）／2026/11/16／星期一／十月初八（農曆不閃爍）
           */
          class LunarClockSimpleWidget : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  Reminders.scheduleAll(context) // 順便確保所有提醒的鬧鐘還在
                  for (id in appWidgetIds) {
                      appWidgetManager.updateAppWidget(id, buildViews(context))
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  when (intent.action) {
                      Intent.ACTION_DATE_CHANGED,
                      Intent.ACTION_TIME_CHANGED,
                      Intent.ACTION_TIMEZONE_CHANGED -> {
                          val manager = AppWidgetManager.getInstance(context)
                          val ids = manager.getAppWidgetIds(
                              ComponentName(context, LunarClockSimpleWidget::class.java)
                          )
                          onUpdate(context, manager, ids)
                      }
                  }
              }

              private fun buildViews(context: Context): RemoteViews {
                  val views = RemoteViews(context.packageName, R.layout.widget_lunar_clock_simple)
                  // "丙午年 十月初八" → 只取 "十月初八"
                  views.setTextViewText(R.id.lunar_text, LunarClockWidget.lunarString().substringAfter(" "))

                  val intent = Intent(AlarmClock.ACTION_SHOW_ALARMS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val pi = PendingIntent.getActivity(
                      context, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  views.setOnClickPendingIntent(R.id.widget_root, pi)
                  return views
              }
          }
          LUNAR_EOF
          mkdir -p app/src/main/java/com/example/lunarclock
          cat > app/src/main/java/com/example/lunarclock/LunarClockWidget.kt <<'LUNAR_EOF'
          package com.example.lunarclock

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.content.Intent
          import android.icu.util.ChineseCalendar
          import android.provider.AlarmClock
          import android.view.View
          import android.widget.RemoteViews
          import java.util.Locale

          /**
           * 時鐘 Widget：
           * - 時間（含秒）與西曆日期由 layout 內的 TextClock 自行每秒更新，不耗電。
           * - 農曆（丙午年 十月初七）由這裡計算，日期變更 / 校時 / 換時區時重新更新。
           */
          class LunarClockWidget : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  Reminders.scheduleAll(context) // 順便確保所有提醒的鬧鐘還在
                  for (id in appWidgetIds) {
                      appWidgetManager.updateAppWidget(id, buildViews(context))
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  when (intent.action) {
                      Intent.ACTION_DATE_CHANGED,
                      Intent.ACTION_TIME_CHANGED,
                      Intent.ACTION_TIMEZONE_CHANGED -> {
                          val manager = AppWidgetManager.getInstance(context)
                          val ids = manager.getAppWidgetIds(
                              android.content.ComponentName(context, LunarClockWidget::class.java)
                          )
                          onUpdate(context, manager, ids)
                      }
                  }
              }

              private fun buildViews(context: Context): RemoteViews {
                  val views = RemoteViews(context.packageName, R.layout.widget_lunar_clock)
                  val lunar = lunarString()
                  views.setTextViewText(R.id.lunar_text, lunar)
                  views.setTextViewText(R.id.lunar_blink_on, lunar)
                  views.setTextViewText(R.id.lunar_blink_off, lunar)

                  // 十齋日：農曆那一行每 0.5 秒閃爍（ViewFlipper 切換），其餘日子正常顯示
                  val fast = isVegetarianDay()
                  views.setViewVisibility(R.id.lunar_text, if (fast) View.GONE else View.VISIBLE)
                  views.setViewVisibility(R.id.fast_flipper, if (fast) View.VISIBLE else View.GONE)

                  // 點一下 widget 開啟時鐘 / 鬧鐘 App
                  val intent = Intent(AlarmClock.ACTION_SHOW_ALARMS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val pi = PendingIntent.getActivity(
                      context, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  views.setOnClickPendingIntent(R.id.widget_root, pi)
                  return views
              }

              companion object {
                  private const val STEMS = "甲乙丙丁戊己庚辛壬癸"
                  private const val BRANCHES = "子丑寅卯辰巳午未申酉戌亥"
                  private val MONTHS = arrayOf(
                      "正月", "二月", "三月", "四月", "五月", "六月",
                      "七月", "八月", "九月", "十月", "十一月", "十二月"
                  )
                  private val DAY_TENS = arrayOf("初", "十", "廿", "三")
                  private const val DAY_ONES = "十一二三四五六七八九"

                  /** 例如：丙午年 十月初七 */
                  fun lunarString(): String {
                      val cal = ChineseCalendar(Locale.TAIWAN)
                      cal.timeInMillis = System.currentTimeMillis()

                      // ChineseCalendar.YEAR = 60 甲子循環中的第幾年 (1..60)
                      val idx = cal.get(ChineseCalendar.YEAR) - 1
                      val ganZhi = "${STEMS[idx % 10]}${BRANCHES[idx % 12]}年"

                      val leap = if (cal.get(ChineseCalendar.IS_LEAP_MONTH) == 1) "閏" else ""
                      val month = leap + MONTHS[cal.get(ChineseCalendar.MONTH)]
                      return "$ganZhi $month${dayName(cal.get(ChineseCalendar.DAY_OF_MONTH))}"
                  }

                  /**
                   * 十齋日：農曆初一、初八、十四、十五、十八、二十三、二十四、二十八、二十九、三十。
                   * 小月（只有 29 天）時，最後三天改為二十七、二十八、二十九。
                   */
                  fun isVegetarianDay(): Boolean {
                      val cal = ChineseCalendar(Locale.TAIWAN)
                      cal.timeInMillis = System.currentTimeMillis()
                      val day = cal.get(ChineseCalendar.DAY_OF_MONTH)
                      val maxDay = cal.getActualMaximum(ChineseCalendar.DAY_OF_MONTH)
                      val days = if (maxDay >= 30)
                          setOf(1, 8, 14, 15, 18, 23, 24, 28, 29, 30)
                      else
                          setOf(1, 8, 14, 15, 18, 23, 24, 27, 28, 29)
                      return day in days
                  }

                  private fun dayName(d: Int): String = when (d) {
                      10 -> "初十"
                      20 -> "二十"
                      30 -> "三十"
                      else -> DAY_TENS[d / 10] + DAY_ONES[d % 10]
                  }
              }
          }
          LUNAR_EOF
          mkdir -p app/src/main/java/com/example/lunarclock
          cat > app/src/main/java/com/example/lunarclock/MainActivity.kt <<'LUNAR_EOF'
          package com.example.lunarclock

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.NumberPicker
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var listBox: LinearLayout

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // Android 13 以上要使用者允許通知
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  Reminders.scheduleAll(this)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                  }
                  root.addView(TextView(this).apply {
                      text = "推播提醒"
                      textSize = 22f
                      setTypeface(typeface, Typeface.BOLD)
                  })
                  root.addView(TextView(this).apply {
                      text = "桌面 Widget：長按桌面空白處 → 小工具 → 找「農曆時鐘」"
                      textSize = 13f
                      setTextColor(Color.GRAY)
                      setPadding(0, dp(4), 0, dp(8))
                  })
                  root.addView(Button(this).apply {
                      text = "＋ 新增提醒"
                      setOnClickListener { showEditor(null) }
                  })
                  listBox = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  root.addView(
                      ScrollView(this).apply { addView(listBox) },
                      LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  )
                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              // ---------- 清單 ----------

              private fun refresh() {
                  listBox.removeAllViews()
                  val list = Reminders.load(this)
                  if (list.isEmpty()) {
                      listBox.addView(TextView(this).apply {
                          text = "還沒有提醒，按上方「＋ 新增提醒」"
                          setPadding(0, dp(16), 0, 0)
                      })
                  }
                  for (r in list) listBox.addView(buildRow(r))
              }

              private fun buildRow(r: Reminder): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(14), dp(12), dp(14), dp(8))
                      background = GradientDrawable().apply {
                          setColor(0xFFF0F0F0.toInt())
                          cornerRadius = dp(14).toFloat()
                      }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { setMargins(0, dp(10), 0, 0) }
                  }

                  val top = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  top.addView(
                      TextView(this).apply {
                          text = r.text
                          textSize = 17f
                          setTypeface(typeface, Typeface.BOLD)
                      },
                      LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  )
                  top.addView(Switch(this).apply {
                      isChecked = r.enabled
                      setOnCheckedChangeListener { _, checked ->
                          val list = Reminders.load(this@MainActivity)
                          val target = list.firstOrNull { it.id == r.id }
                          if (target != null) {
                              target.enabled = checked
                              Reminders.save(this@MainActivity, list)
                              Reminders.schedule(this@MainActivity, target)
                              refresh()
                          }
                      }
                  })
                  row.addView(top)

                  row.addView(TextView(this).apply {
                      text = Reminders.describe(r)
                      textSize = 13f
                      setTextColor(Color.DKGRAY)
                      setPadding(0, dp(2), 0, dp(4))
                  })

                  val buttons = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.END
                  }
                  fun small(label: String, onClick: () -> Unit) = Button(this).apply {
                      text = label
                      textSize = 13f
                      minHeight = 0
                      minimumHeight = 0
                      minWidth = 0
                      minimumWidth = 0
                      setPadding(dp(14), dp(6), dp(14), dp(6))
                      setOnClickListener { onClick() }
                  }
                  buttons.addView(small("測試") {
                      Reminders.show(this, r)
                      Toast.makeText(this, "已發送測試通知", Toast.LENGTH_SHORT).show()
                  })
                  buttons.addView(small("編輯") { showEditor(r) })
                  buttons.addView(small("刪除") { confirmDelete(r) })
                  row.addView(buttons)
                  return row
              }

              private fun confirmDelete(r: Reminder) {
                  AlertDialog.Builder(this)
                      .setTitle("刪除提醒")
                      .setMessage("確定要刪除「${r.text}」嗎？")
                      .setNegativeButton("取消", null)
                      .setPositiveButton("刪除") { _, _ ->
                          val list = Reminders.load(this)
                          list.removeAll { it.id == r.id }
                          Reminders.save(this, list)
                          Reminders.cancel(this, r.id)
                          refresh()
                      }
                      .show()
              }

              // ---------- 新增 / 編輯 ----------

              private fun picker(min: Int, max: Int, value: Int): NumberPicker =
                  NumberPicker(this).apply {
                      minValue = min
                      maxValue = max
                      this.value = value
                  }

              private fun label(t: String) = TextView(this).apply {
                  text = t
                  textSize = 16f
                  setPadding(dp(8), 0, dp(8), 0)
              }

              private fun hRow(vararg views: View) = LinearLayout(this).apply {
                  orientation = LinearLayout.HORIZONTAL
                  gravity = Gravity.CENTER
                  for (v in views) addView(v)
              }

              private fun daysIn(month: Int): Int = when (month) {
                  2 -> 29
                  4, 6, 9, 11 -> 30
                  else -> 31
              }

              private fun showEditor(existing: Reminder?) {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(8), dp(20), dp(8))
                  }

                  val etText = EditText(this).apply {
                      hint = "推播內容，例如：聖誕節快樂！"
                      setText(existing?.text ?: "")
                  }
                  val rbSolar = RadioButton(this).apply { text = "國曆"; id = View.generateViewId() }
                  val rbLunar = RadioButton(this).apply { text = "農曆"; id = View.generateViewId() }
                  val group = RadioGroup(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      addView(rbSolar)
                      addView(rbLunar)
                  }
                  val monthP = picker(1, 12, existing?.month ?: 1)
                  val dayP = picker(1, 31, existing?.day ?: 1)
                  val hourP = picker(0, 23, existing?.hour ?: 8)
                  val minP = picker(0, 59, existing?.minute ?: 0)
                  group.setOnCheckedChangeListener { _, checkedId ->
                      dayP.maxValue = if (checkedId == rbLunar.id) 30 else 31
                  }
                  if (existing?.lunar == true) rbLunar.isChecked = true else rbSolar.isChecked = true

                  val repeatCb = CheckBox(this).apply {
                      text = "每年重複（取消勾選＝只提醒一次）"
                      isChecked = existing?.repeat ?: true
                  }

                  box.addView(etText)
                  box.addView(TextView(this).apply { text = "日期類型"; setPadding(0, dp(12), 0, 0) })
                  box.addView(group)
                  box.addView(hRow(monthP, label("月"), dayP, label("日")))
                  box.addView(TextView(this).apply { text = "時間"; setPadding(0, dp(8), 0, 0) })
                  box.addView(hRow(hourP, label("時"), minP, label("分")))
                  box.addView(repeatCb)
                  box.addView(TextView(this).apply {
                      text = "農曆為一般月份（不含閏月）。例如農曆正月初一，每年會自動換算成當年的國曆日期。"
                      textSize = 12f
                      setTextColor(Color.GRAY)
                      setPadding(0, dp(4), 0, 0)
                  })

                  val dialog = AlertDialog.Builder(this)
                      .setTitle(if (existing == null) "新增提醒" else "編輯提醒")
                      .setView(ScrollView(this).apply { addView(box) })
                      .setNegativeButton("取消", null)
                      .setPositiveButton("儲存", null)
                      .create()
                  dialog.show()

                  // 自己處理「儲存」，驗證失敗時對話框不關閉
                  dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener {
                      val content = etText.text.toString().trim()
                      val lunar = rbLunar.isChecked
                      val month = monthP.value
                      val day = dayP.value
                      if (content.isEmpty()) {
                          Toast.makeText(this, "請輸入推播內容", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      if (!lunar && day > daysIn(month)) {
                          Toast.makeText(this, "${month}月沒有${day}日", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      val list = Reminders.load(this)
                      val item = Reminder(
                          existing?.id ?: Reminders.newId(this),
                          content, lunar, month, day, hourP.value, minP.value,
                          repeatCb.isChecked, true
                      )
                      val idx = list.indexOfFirst { it.id == item.id }
                      if (idx >= 0) list[idx] = item else list.add(item)
                      Reminders.save(this, list)
                      Reminders.schedule(this, item)
                      dialog.dismiss()
                      refresh()
                  }
              }
          }
          LUNAR_EOF
          mkdir -p app/src/main/java/com/example/lunarclock
          cat > app/src/main/java/com/example/lunarclock/PuppyWidget.kt <<'LUNAR_EOF'
          package com.example.lunarclock

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.provider.AlarmClock
          import android.view.View
          import android.widget.RemoteViews

          /**
           * 小狗跳跳時鐘 Widget（共用邏輯）。
           * - 時間、日期、星期、秒數字由 TextClock 自行更新。
           * - 小狗跳躍：ViewFlipper 每 0.125 秒切換一張圖（layout 內設定）。
           * - 農曆：這裡計算；十齋日改用 ViewFlipper 每 0.5 秒閃爍。
           */
          abstract class PuppyWidgetBase(private val layoutRes: Int) : AppWidgetProvider() {

              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  Reminders.scheduleAll(context) // 順便確保所有提醒的鬧鐘還在
                  for (id in appWidgetIds) {
                      appWidgetManager.updateAppWidget(id, buildViews(context))
                  }
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  when (intent.action) {
                      Intent.ACTION_DATE_CHANGED,
                      Intent.ACTION_TIME_CHANGED,
                      Intent.ACTION_TIMEZONE_CHANGED -> {
                          val manager = AppWidgetManager.getInstance(context)
                          val ids = manager.getAppWidgetIds(ComponentName(context, this::class.java))
                          onUpdate(context, manager, ids)
                      }
                  }
              }

              private fun buildViews(context: Context): RemoteViews {
                  val views = RemoteViews(context.packageName, layoutRes)
                  val lunar = LunarClockWidget.lunarString()
                  views.setTextViewText(R.id.lunar_text, lunar)
                  views.setTextViewText(R.id.lunar_blink_on, lunar)
                  views.setTextViewText(R.id.lunar_blink_off, lunar)

                  val fast = LunarClockWidget.isVegetarianDay()
                  views.setViewVisibility(R.id.lunar_text, if (fast) View.GONE else View.VISIBLE)
                  views.setViewVisibility(R.id.fast_flipper, if (fast) View.VISIBLE else View.GONE)

                  val intent = Intent(AlarmClock.ACTION_SHOW_ALARMS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val pi = PendingIntent.getActivity(
                      context, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  views.setOnClickPendingIntent(R.id.widget_root, pi)
                  return views
              }
          }

          class PuppyWidget2x2 : PuppyWidgetBase(R.layout.widget_puppy_2x2)

          class PuppyWidget4x1 : PuppyWidgetBase(R.layout.widget_puppy_4x1)
